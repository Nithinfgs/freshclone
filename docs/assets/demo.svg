y:1}100%{opacity:0}}.l18{animation:l18 20s infinite}@keyframes l19{0%,25.20%{opacity:0}25.40%,94%{opacity:1}100%{opacity:0}}.l19{animation:l19 20s infinite}@keyframes l20{0%,25.65%{opacity:0}25.85%,94%{opacity:1}100%{opacity:0}}.l20{animation:l20 20s infinite}@keyframes l21{0%,26.10%{opacity:0}26.30%,94%{opacity:1}100%{opacity:0}}.l21{animation:l21 20s infinite}@keyframes l22{0%,26.55%{opacity:0}26.75%,94%{opacity:1}100%{opacity:0}}.l22{animation:l22 20s infinite}@keyframes l23{0%,27.00%{opacity:0}27.20%,94%{opacity:1}100%{opacity:0}}.l23{animation:l23 20s infinite}@keyframes l24{0%,27.45%{opacity:0}27.65%,94%{opacity:1}100%{opacity:0}}.l24{animation:l24 20s infinite}@keyframes l25{0%,27.90%{opacity:0}28.10%,94%{opacity:1}100%{opacity:0}}.l25{animation:l25 20s infinite}@keyframes l26{0%,28.35%{opacity:0}28.55%,94%{opacity:1}100%{opacity:0}}.l26{animation:l26 20s infinite}@keyframes l27{0%,28.80%{opacity:0}29.00%,94%{opacity:1}100%{opacity:0}}.l27{animation:l27 20s infinite}@keyframes l28{0%,29.25%{opacity:0}29.45%,94%{opacity:1}100%{opacity:0}}.l28{animation:l28 20s infinite}@keyframes l29{0%,29.70%{opacity:0}29.90%,94%{opacity:1}100%{opacity:0}}.l29{animation:l29 20s infinite}@media (prefers-reduced-motion:reduce){.t{animation:none!important;opacity:1}}</style>
<rect width="840" height="656" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="24" cy="22" r="6" fill="#f85149"/><circle cx="44" cy="22" r="6" fill="#d29922"/><circle cx="64" cy="22" r="6" fill="#3fb950"/>
<text x="420" y="26" text-anchor="middle" style="font:12px ui-monospace,Menlo,monospace;fill:#8b949e">freshclone --demo</text>
<text class="t l0" x="24" y="62" xml:space="preserve"><tspan style="font-weight:700">freshclone</tspan><tspan> README.md</tspan></text>
<text class="t l1" x="24" y="81" xml:space="preserve"><tspan style="fill:#8b949e">clean room: 5 files from git, empty HOME, scrubbed env</tspan></text>
<text class="t l2" x="24" y="100" xml:space="preserve"></text>
<text class="t l3" x="24" y="119" xml:space="preserve"><tspan> </tspan><tspan style="fill:#3fb950">✓</tspan><tspan> </tspan><tspan style="fill:#8b949e"> 1</tspan><tspan>  npm install  </tspan><tspan style="fill:#8b949e">249ms</tspan></text>
<text class="t l4" x="24" y="138" xml:space="preserve"><tspan> </tspan><tspan style="fill:#f85149">✗</tspan><tspan> </tspan><tspan style="fill:#8b949e"> 2</tspan><tspan>  cp .env.example .env  </tspan><tspan style="fill:#8b949e">6ms</tspan></text>
<text class="t l5" x="24" y="157" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan> cp: .env.example: No such file or directory</tspan></text>
<text class="t l6" x="24" y="176" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#58a6ff">→</tspan><tspan> `.env.example` exists on your machine but is gitignored (rule: .env*), so a fresh</tspan></text>
<text class="t l7" x="24" y="195" xml:space="preserve"><tspan>         clone does not have it.</tspan></text>
<text class="t l8" x="24" y="214" xml:space="preserve"><tspan>         </tspan><tspan style="fill:#8b949e">fix:</tspan><tspan> Commit it (e.g. add `!.env.example` to .gitignore), or add a README step that</tspan></text>
<text class="t l9" x="24" y="233" xml:space="preserve"><tspan>              creates it.</tspan></text>
<text class="t l10" x="24" y="252" xml:space="preserve"><tspan> </tspan><tspan style="fill:#f85149">✗</tspan><tspan> </tspan><tspan style="fill:#8b949e"> 3</tspan><tspan>  ./scripts/bootstrap.sh  </tspan><tspan style="fill:#8b949e">5ms</tspan></text>
<text class="t l11" x="24" y="271" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan> ./scripts/bootstrap.sh: Permission denied</tspan></text>
<text class="t l12" x="24" y="290" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#58a6ff">→</tspan><tspan> `scripts/bootstrap.sh` is committed without the executable bit (mode 100644). On</tspan></text>
<text class="t l13" x="24" y="309" xml:space="preserve"><tspan>         your disk it is probably executable.</tspan></text>
<text class="t l14" x="24" y="328" xml:space="preserve"><tspan>         </tspan><tspan style="fill:#8b949e">fix:</tspan><tspan> git update-index --chmod=+x scripts/bootstrap.sh</tspan></text>
<text class="t l15" x="24" y="347" xml:space="preserve"><tspan> </tspan><tspan style="fill:#f85149">✗</tspan><tspan> </tspan><tspan style="fill:#8b949e"> 4</tspan><tspan>  npm run check  </tspan><tspan style="fill:#8b949e">102ms</tspan></text>
<text class="t l16" x="24" y="366" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan> &gt; tinyserver@1.0.0 check</tspan></text>
<text class="t l17" x="24" y="385" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan> &gt; node server.js --check</tspan></text>
<text class="t l18" x="24" y="404" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan> server.js:2</tspan></text>
<text class="t l19" x="24" y="423" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan>   throw new Error('DATABASE_URL is required');</tspan></text>
<text class="t l20" x="24" y="442" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan>   ^</tspan></text>
<text class="t l21" x="24" y="461" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#8b949e">│</tspan><tspan> Error: DATABASE_URL is required</tspan></text>
<text class="t l22" x="24" y="480" xml:space="preserve"><tspan>       </tspan><tspan style="fill:#58a6ff">→</tspan><tspan> `DATABASE_URL` is set in your shell, but this README never mentions it. New users</tspan></text>
<text class="t l23" x="24" y="499" xml:space="preserve"><tspan>         will not have it.</tspan></text>
<text class="t l24" x="24" y="518" xml:space="preserve"><tspan>         </tspan><tspan style="fill:#8b949e">fix:</tspan><tspan> Document it, e.g. `export DATABASE_URL=...`, or ship a .env.example.</tspan></text>
<text class="t l25" x="24" y="537" xml:space="preserve"></text>
<text class="t l26" x="24" y="556" xml:space="preserve"><tspan style="fill:#3fb950">1 passed</tspan><tspan>, </tspan><tspan style="fill:#f85149">3 failed</tspan><tspan> </tspan><tspan style="fill:#8b949e">in 408ms</tspan></text>
<text class="t l27" x="24" y="575" xml:space="preserve"><tspan style="fill:#f85149">Your README does not work from a fresh clone.</tspan></text>
<text class="t l28" x="24" y="594" xml:space="preserve"></text>
<text class="t l29" x="24" y="613" xml:space="preserve"></text>
</svg>
